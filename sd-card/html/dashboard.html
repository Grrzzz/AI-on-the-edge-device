<!doctype html>
<html lang="en">

<head>
  <title>Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=720" />

  <script>
    // Theme Control
    (function () {
      let theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { }
      if (theme !== 'light' && theme !== 'dark') {
        try { theme = document.cookie.match(/(?:^|; )theme=(light|dark)/)?.[1]; } catch (e) { }
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme);
    })();
  </script>

  <link rel="stylesheet" href="style-iframe.css?v=$COMMIT_HASH" />

  <style>
    html,
    body {
      width: unset;
      max-width: var(--content-max-width);
    }

    input[type='number'] {
      font-size: inherit;
    }

    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px 24px;
      padding: 4px 0 18px;
    }

    .dash {
      display: grid;
      grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
      gap: var(--card-gap);
      align-items: start;
    }

    .dash-side {
      display: flex;
      flex-direction: column;
      gap: var(--card-gap);
      min-width: 0;
    }

    /* Hero: one card per sequence */
    .hero {
      padding: 22px 24px 22px;
      gap: 4px;
    }

    .hero-label {
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .hero-value {
      margin-top: 4px;
      font-size: 2.6rem;
      line-height: 1.1;
      font-weight: 700;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      word-break: break-all;
    }

    .hero-status {
      margin: 6px 0 14px;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--success);
    }

    .hero-status small {
      display: block;
      font-size: 0.82rem;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .hero.status-err .hero-status {
      color: var(--error);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: var(--card-gap);
    }

    .stat.wide {
      grid-column: 1 / -1;
    }

    #processerror {
      margin-top: 8px;
      color: var(--error);
      font-size: 0.9rem;
      font-weight: 600;
    }

    #processerror:empty {
      display: none;
    }

    .image-card .card-body {
      padding: 0 12px 12px;
      display: flex;
      justify-content: center;
    }

    #img:not([src]),
    #img[src=''] {
      visibility: hidden;
    }

    #img {
      min-width: 0;
      width: 100%;
      height: auto;
      display: block;
      border-radius: 0.6rem;
    }

    #img.is-loading {
      width: 50px;
      height: 50px;
      margin: 40px auto;
      object-fit: contain;
    }

    /* Inline fallback value editor inside the hero card */
    .hero-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .fallback-edit {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .fallback-edit label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .fallback-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .fallback-row input {
      flex: 1 1 140px;
      min-width: 0;
      max-width: none;
      appearance: textfield;
      -moz-appearance: textfield;
    }

    .fallback-row input::-webkit-outer-spin-button,
    .fallback-row input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .fallback-row .button {
      width: auto;
      padding: 8px 16px;
    }

    .fallback-hint {
      margin-top: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* Activity: latest log messages */
    .activity {
      margin-top: var(--card-gap);
    }

    .activity-sub {
      padding: 0 20px 12px;
      margin-top: -4px;
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .link-btn {
      border: 0;
      background: none;
      padding: 0;
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--primary);
      cursor: pointer;
    }

    .link-btn:hover {
      text-decoration: underline;
    }

    .console {
      margin: 0 16px 16px;
      padding: 14px 16px;
      min-height: 120px;
      max-height: 300px;
      overflow: auto;
      border-radius: 0.65rem;
      background: #0a0f1c;
      color: #cbd5e1;
      font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace;
      font-size: 0.8rem;
      line-height: 1.65;
    }

    .log-line {
      display: flex;
      gap: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .log-ts {
      flex: none;
      color: #64748b;
    }

    .log-lvl {
      flex: none;
      width: 3ch;
      font-weight: 700;
    }

    .log-line.lvl-ERR .log-lvl,
    .log-line.lvl-ERR .log-msg {
      color: #f87171;
    }

    .log-line.lvl-WRN .log-lvl,
    .log-line.lvl-WRN .log-msg {
      color: #fbbf24;
    }

    .log-line.lvl-INF .log-lvl {
      color: #60a5fa;
    }

    .log-empty {
      color: #64748b;
    }

    @media screen and (max-width: 900px) {
      .dash {
        grid-template-columns: minmax(0, 1fr);
      }
    }
  </style>

  <link href="firework.css?v=$COMMIT_HASH" rel="stylesheet" />
  <script src="firework.js?v=$COMMIT_HASH"></script>
</head>

<body>
  <div class="container">
    <header class="page-head">
      <div>
        <div class="container-title">Dashboard</div>
        <div class="page-sub">Live reading and process state of your meter.</div>
      </div>
      <div class="refresh-group">
        <div class="refresh-loader">
          <div id="refreshLoadingImg" class="loader">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" class="spinner-svg">
              <path d="M12 3a9 9 0 1 1-6.36 2.64"></path>
            </svg>
          </div>
          <button id="refreshButton" class="button btn-action" style="width: 120px" onclick="refreshContent()">Refresh</button>
        </div>
      </div>
    </header>

    <main class="dash">
      <div class="dash-side">
        <div id="dynamic-sequences" style="display: contents">
          <div class="card hero" id="sequence-placeholder-card">
            <div class="hero-label">Sequence</div>
            <div class="hero-value">--</div>
          </div>
        </div>

        <div class="stats">
          <div class="stat wide">
            <div class="stat-label">Process state</div>
            <div class="stat-value small" id="statusflow">--</div>
            <div id="processerror"></div>
          </div>
          <div class="stat">
            <div class="stat-label">Uptime</div>
            <div class="stat-value"><output id="device_uptime">--</output></div>
          </div>
          <div class="stat">
            <div class="stat-label">Cycles</div>
            <div class="stat-value"><output id="cycle_counter">--</output></div>
          </div>
          <div class="stat wide" id="wlan_rssi_info">
            <div class="stat-label">Wi-Fi signal</div>
            <div class="stat-value small">
              <svg id="rssi_svg" width="20" height="16" viewBox="0 0 24 16" fill="currentColor" style="overflow: visible">
                <rect class="bar" x="1" y="12" width="3" height="4" rx="1" />
                <rect class="bar" x="7" y="8" width="3" height="8" rx="1" />
                <rect class="bar" x="13" y="4" width="3" height="12" rx="1" />
                <rect class="bar" x="19" y="0" width="3" height="16" rx="1" />
              </svg>
              <output id="wlan_rssi">-</output>
            </div>
          </div>
        </div>
      </div>

      <div class="card image-card">
        <div class="card-header">Image view</div>
        <div class="card-body">
          <img class="is-loading" id="img" src="" />
        </div>
      </div>
    </main>

    <section class="card activity">
      <div class="card-header">
        <span>Activity</span>
      </div>
      <div class="activity-sub">Latest messages from the device.</div>
      <div class="console" id="activityLog" aria-live="polite"><span class="log-empty">Loading ...</span></div>
    </section>
  </div>

  <script src="global.js?v=$COMMIT_HASH"></script>
  <script>
    let autoRefreshTimeoutHandle = null;
    let refreshRunning = false;
    let lastImageKey = null;

    const STATUS_TEXT = {
      '000': ['Valid'],
      'W01': ['Empty / Invalid Data'],
      'E91': ['Rate Negative', 'Use Fallback Value'],
      'E92': ['Rate Too High (<)', 'Use Fallback Value'],
      'E93': ['Rate Too High (>)', 'Use Fallback Value'],
    };

    const ERROR_STATES = [
      'initialization - delayed',
      'initialization failed',
      'setup mode',
      'idle - no autostart',
      'idle - waiting for autostart',
    ];

    function statusContent(val) {
      const text = String(val ?? '');
      const entry = STATUS_TEXT[text.substring(0, 3)];
      if (!entry) return text;

      const frag = document.createDocumentFragment();
      frag.append(entry[0]);
      if (entry[1]) {
        const hint = document.createElement('small');
        hint.textContent = entry[1];
        frag.append(document.createElement('br'), hint);
      }
      return frag;
    }

    function renderSequenceCards(data) {
      const container = document.getElementById('dynamic-sequences');
      if (!container) return;
      container.textContent = '';

      const show = (v) => (v === null || v === undefined || v === '' ? '--' : String(v));
      const el = (tag, cls, text) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (text !== undefined) e.textContent = text;
        return e;
      };
      const chip = (label, value, title) => {
        const c = el('span', 'chip');
        c.append(el('b', '', label), document.createTextNode(value));
        if (title) c.title = title;
        return c;
      };

      for (const seq of Object.keys(data.actual_value ?? {})) {
        const fallback = show(data.fallback_value?.[seq]);
        const fbTime = String(data.timestamp_fallbackvalue?.[seq] ?? '');
        const statusCode = String(data.value_status?.[seq] ?? '').substring(0, 3);
        const isOk = ['', '000', 'E91'].includes(statusCode);

        const card = el('div', `card hero ${isOk ? 'status-valid' : 'status-err'}`);
        const status = el('div', 'hero-status');
        status.append(statusContent(data.value_status?.[seq]));

        const chips = el('div', 'chips');
        chips.append(chip('Raw', show(data.raw_value?.[seq])));
        const fbTitle = fallback !== '--' && fallback !== 'Disabled' && fbTime.length >= 19 ? `Set ${fbTime.substring(0, 10)} ${fbTime.substring(11, 19)}` : '';
        chips.append(chip('Fallback', fallback, fbTitle));

        const actions = el('div', 'hero-actions');
        const edit = el('button', 'link-btn', 'Set fallback value');
        edit.type = 'button';
        const rawNum = parseFloat(String(data.raw_value?.[seq] ?? '').replace(',', '.'));
        const actNum = parseFloat(String(data.actual_value?.[seq] ?? '').replace(',', '.'));
        const prefill = !Number.isNaN(rawNum) ? rawNum : !Number.isNaN(actNum) ? actNum : '';
        edit.onclick = () => openFallbackEditor(card, seq, prefill);
        actions.append(chips, edit);

        card.append(el('div', 'hero-label', `Sequence \u00b7 ${seq}`), el('div', 'hero-value', show(data.actual_value[seq])), status, actions);
        container.appendChild(card);
      }
    }

    // ------------------------------------------------------------------
    // Fallback value: set directly from the dashboard
    // ------------------------------------------------------------------
    let fallbackEditingSeq = null; // while set, the automatic refresh does not re-render the cards

    function closeFallbackEditor(card) {
      card.querySelector('.fallback-edit')?.remove();
      fallbackEditingSeq = null;
    }

    function openFallbackEditor(card, seq, prefill) {
      if (card.querySelector('.fallback-edit')) {
        closeFallbackEditor(card);
        return;
      }
      document.querySelectorAll('.fallback-edit').forEach((e) => e.remove()); // only one editor at a time
      fallbackEditingSeq = seq;

      const box = document.createElement('div');
      box.className = 'fallback-edit';

      const id = `fb_input_${Math.random().toString(36).slice(2, 8)}`;
      const label = document.createElement('label');
      label.htmlFor = id;
      label.textContent = 'New fallback value';

      const row = document.createElement('div');
      row.className = 'fallback-row';
      const input = document.createElement('input');
      input.type = 'number';
      input.step = 'any';
      input.id = id;
      input.value = prefill;
      input.required = true;

      const apply = document.createElement('button');
      apply.type = 'button';
      apply.className = 'button btn-action';
      apply.textContent = 'Apply';

      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'button';
      cancel.textContent = 'Cancel';
      cancel.onclick = () => closeFallbackEditor(card);

      const submit = async () => {
        const value = parseFloat(String(input.value).replace(',', '.'));
        if (Number.isNaN(value)) return firework.launch('Invalid number entered', 'warning', 2000);

        apply.disabled = true;
        const endpoint = `/set_fallbackvalue?sequence=${encodeURIComponent(seq)}&value=${encodeURIComponent(value)}`;
        const res = await apiCallNotify(endpoint, {}, {
          action: 'Fallback value update',
          loadingMsg: 'Updating fallback value...',
          resultMsg: 'Fallback value successfully updated',
        });
        apply.disabled = false;
        if (!res.ok) return;

        closeFallbackEditor(card);
        refreshContent();
      };
      apply.onclick = submit;
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') submit();
        if (e.key === 'Escape') closeFallbackEditor(card);
      });

      const hint = document.createElement('div');
      hint.className = 'fallback-hint';
      hint.textContent = 'Pre-filled with the current raw value. The fallback value is the last valid reading the device falls back to.';

      row.append(input, apply, cancel);
      box.append(label, row, hint);
      card.append(box);
      input.focus();
      input.select();
    }

    // Activity log: newest message first, debug messages hidden
    const LOG_REGEX = /^(\[.*?\])\s+(.*?)\s+<(.*?)>\s+\[(.*?)\]\s+(.*)/;
    const LOG_MAX_LINES = 40;

    async function loadActivity() {
      const box = document.getElementById('activityLog');
      if (!box) return;

      const res = await apiCall('/log');
      if (!res.ok || typeof res.data !== 'string') {
        if (res.error !== 'aborted') box.innerHTML = '<span class="log-empty">Log not available</span>';
        return;
      }

      const entries = [];
      const lines = res.data.split('\n');
      for (let i = lines.length - 1; i >= 0 && entries.length < LOG_MAX_LINES; i--) {
        const m = lines[i].match(LOG_REGEX);
        if (!m || m[3] === 'DBG') continue;
        entries.push({ ts: m[2].replace('T', ' ').substring(0, 19), lvl: m[3], mod: m[4], msg: m[5] });
      }

      box.textContent = '';
      if (!entries.length) {
        const empty = document.createElement('span');
        empty.className = 'log-empty';
        empty.textContent = 'No messages yet';
        box.append(empty);
        return;
      }

      for (const e of entries) {
        const row = document.createElement('div');
        row.className = `log-line lvl-${e.lvl}`;
        const ts = document.createElement('span');
        ts.className = 'log-ts';
        ts.textContent = e.ts;
        const lvl = document.createElement('span');
        lvl.className = 'log-lvl';
        lvl.textContent = e.lvl;
        const msg = document.createElement('span');
        msg.className = 'log-msg';
        msg.textContent = `[${e.mod}] ${e.msg}`;
        row.append(ts, lvl, msg);
        box.append(row);
      }
    }

    async function loadProcessData() {
      const res = await apiCall('/process_data', {}, { parseType: 'json' });
      if (!res.ok || !res.data) {
        if (res.error !== 'aborted') console.warn('Process data request failed:', res.error ?? res.status);
        return null;
      }

      const d = res.data;
      try {
        renderSequenceCards(d);

        document.getElementById('statusflow').textContent = d.process_state;
        loadProcessError(d.process_error, d.process_state);

        document.getElementById('device_uptime').textContent = formatUptime(d.device_uptime);
        document.getElementById('cycle_counter').textContent = d.cycle_counter;

        const rssiInfo = document.getElementById('wlan_rssi_info');
        rssiInfo.style.display = d.wlan_rssi === -255 ? 'none' : ''; // hide the row when the device reports no WLAN
        renderRssi(d.wlan_rssi);
      } catch (e) {
        console.error('Rendering process data failed | ', e);
      }

      return `${d.cycle_counter}|${d.process_state}`;
    }

    function loadProcessError(value, processState) {
      const el = document.getElementById('processerror');
      if (!el) return;

      const state = String(processState ?? '').toLowerCase();
      const isErrorState = ERROR_STATES.some((s) => state.includes(s));
      el.textContent = isErrorState && value < 0 ? '⚠ Process error detected. Check logs' : '';
    }

    function loadImage() {
      const imgEl = document.getElementById('img');

      return new Promise((resolve) => {
        const timer = setTimeout(() => resolve(false), 15000); // safety timeout
        const done = (ok) => {
          clearTimeout(timer);
          imgEl.classList.remove('is-loading');
          resolve(ok);
        };

        imgEl.onload = () => done(true);
        imgEl.onabort = () => done(false);
        imgEl.onerror = () => {
          imgEl.onerror = null;
          imgEl.src = typeof noImageAvailable !== 'undefined' ? noImageAvailable : '';
          done(false);
        };

        imgEl.src = `${getDomainname()}/img_tmp/alg_roi.jpg?v=${Date.now()}`;
      });
    }

    async function refreshContent(auto = false) {
      if (refreshRunning) return;
      if (auto && fallbackEditingSeq !== null) return; // keep an open editor untouched
      refreshRunning = true;

      const btn = document.getElementById('refreshButton');
      const loader = document.getElementById('refreshLoadingImg');

      if (!auto) {
        btn.disabled = true;
      }

      loader?.classList.add('is-loading');

      try {
        const key = await loadProcessData();
        if (key === null) return; // device not answering: skip the image
        loadActivity();

        // Manual refresh always reloads the image; auto refresh only when cycle or step changed
        if (!auto || key !== lastImageKey) {
          await loadImage();
          lastImageKey = key;
        }
      } catch (error) {
        console.error('Refresh failed:', error);
      } finally {
        setTimeout(() => {
          if (!auto) btn.disabled = false;
          loader?.classList.remove('is-loading');
        }, 100);
        refreshRunning = false;
      }
    }

    // Fixed refresh interval (no user setting)
    const AUTO_REFRESH_MS = 5000;

    function autoRefreshContent() {
      if (autoRefreshTimeoutHandle) clearTimeout(autoRefreshTimeoutHandle);

      autoRefreshTimeoutHandle = setTimeout(() => {
        refreshContent(true).then(autoRefreshContent);
      }, AUTO_REFRESH_MS);
    }

    async function init() {
      // Show image spinner
      if (typeof loaderSpinner !== 'undefined') document.getElementById('img').src = loaderSpinner;

      lastImageKey = await loadProcessData();
      loadImage();
      loadActivity();

      autoRefreshContent();
    }

    window.addEventListener('DOMContentLoaded', () => {
      window.parent.postMessage({ type: 'iframe-ready' }, '*');
    });

    init();
  </script>
</body>

</html>
