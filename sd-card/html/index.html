<!doctype html>
<html lang="en" xml:lang="en">

<head>
  <title>AI-on-the-Edge Device</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />

  <script>
    // Apply the theme before the first paint (mode: auto | light | dark)
    (function () {
      let mode = 'auto';
      try { mode = localStorage.getItem('theme') || 'auto'; } catch (e) { }
      const dark = mode === 'dark' || (mode !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.classList.add(dark ? 'dark' : 'light');
    })();
  </script>

  <link rel="icon" type="image/x-icon" href="favicon.ico?v=$COMMIT_HASH" />
  <link rel="icon" type="image/svg+xml" id="favicon-svg" href="icon.svg?v=$COMMIT_HASH" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icon-apple-touch.png?v=$COMMIT_HASH" />
  <link rel="manifest" type="application/manifest+json" href="/site.webmanifest?v=$COMMIT_HASH" />
  <link rel="stylesheet" href="style.css?v=$COMMIT_HASH" />
</head>

<body>
  <!-- Icon sprite -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z" /></symbol>
      <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" /><circle cx="12" cy="12" r="3" /></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1" /><circle cx="15" cy="6" r="2" /><circle cx="9" cy="12" r="2" /><circle cx="17" cy="18" r="2" /></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" /><path d="M12 2v4M12 18v4M2 12h4M18 12h4" /></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16" /></symbol>
      <symbol id="i-server" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /></symbol>
      <symbol id="i-chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" /></symbol>
    </defs>
  </svg>

  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" id="brand-logo"></div>
        <div class="brand-text">
          <h1 class="brand-title">AI-on-the-Edge</h1>
          <div class="brand-sub" id="device-name">Loading...</div>
        </div>
      </div>

      <nav class="nav" aria-label="Main navigation">
        <ul class="nav-top">
          <li><a class="nav-item" data-route="dashboard" data-href="#/dashboard" href="#/dashboard"><svg><use href="#i-home" /></svg>Dashboard</a></li>
          <li><a class="nav-item" data-route="config" data-href="#/config" href="#/config"><svg><use href="#i-sliders" /></svg>Configuration</a></li>
        </ul>
        <div class="nav-group" data-group="system">
          <button class="nav-item nav-parent" type="button"><svg><use href="#i-server" /></svg>System<svg class="chev" viewBox="0 0 24 24"><use href="#i-chev" /></svg></button>
          <ul class="nav-sub">
            <li><a class="nav-sub-item" data-route="system-info" data-href="#/system/info" href="#/system/info">Info</a></li>
            <li><a class="nav-sub-item" data-route="system-setup" data-href="#/system/setup" href="#/system/setup">Setup</a></li>
            <li><a class="nav-sub-item" data-route="system-mcp" data-href="#/system/mcp" href="#/system/mcp">MCP</a></li>
            <li><a class="nav-sub-item" data-route="system-backup" data-href="#/system/backup" href="#/system/backup">Backup / Restore</a></li>
            <li><a class="nav-sub-item" data-route="system-files" data-href="#/system/files" href="#/system/files">File Explorer</a></li>
            <li><a class="nav-sub-item" data-route="system-update" data-href="#/system/update" href="#/system/update">Update</a></li>
            <li><a class="nav-sub-item" data-route="system-reboot" data-href="#/system/reboot" href="#/system/reboot">Reboot</a></li>
          </ul>
        </div>
      </nav>

      <div class="cycle" id="cycle-panel" data-kind="idle">
        <div class="cycle-head">
          <span class="cycle-label">Cycle</span>
          <span class="cycle-count" id="cycle-count">#-</span>
        </div>
        <div class="cycle-state">
          <span class="cycle-dot"></span>
          <span class="cycle-scan" id="cycle-scan"></span>
          <span id="cycle-state">Connecting ...</span>
        </div>
        <div class="cycle-timer-row">
          <div class="cycle-timer" id="cycle-timer">&nbsp;</div>
          <button class="cycle-pause" id="cycle-pause" type="button" hidden aria-label="Pause countdown">
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12" /></svg>
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10-6.5z" /></svg>
          </button>
        </div>
        <div class="cycle-last" id="cycle-last" hidden>Last success: <span id="cycle-last-value">-</span></div>
        <button class="button btn-action cycle-btn" id="cycle-start" type="button" disabled>Start cycle</button>
      </div>

      <div class="sidebar-footer">
        <div class="theme-seg" role="group" aria-label="Theme">
          <button type="button" data-mode="auto">Auto</button>
          <button type="button" data-mode="light">Light</button>
          <button type="button" data-mode="dark">Dark</button>
        </div>
        <div class="foot-meta">
          <span class="foot-ver">
            <span id="fw-version">&nbsp;</span>
            <button class="update-hint" id="update-hint" type="button" hidden aria-label="Newer version available">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" /><path d="M12 11v5M12 7.8h.01" /></svg>
            </button>
          </span>
          <a href="https://github.com/Grrzzz/AI-on-the-edge-device" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </div>
    </aside>

    <div class="scrim" id="nav-scrim"></div>

    <main class="content">
      <div class="topbar">
        <button class="icon-btn" id="nav-toggle" type="button" aria-label="Open menu"><svg viewBox="0 0 24 24"><use href="#i-menu" /></svg></button>
        <div class="topbar-title" id="topbar-title">AI-on-the-Edge</div>
      </div>
      <div class="view-host" id="view"></div>
    </main>
  </div>

  <script src="app.js?v=$COMMIT_HASH"></script>
</body>

</html>
