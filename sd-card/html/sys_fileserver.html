<!doctype html>
<html lang="en" xml:lang="en">

<head>
  <title>File Explorer</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=720" />

  <script>
    // Theme Control
    (function () {
      let theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { }
      if (theme !== 'light' && theme !== 'dark') {
        try { theme = document.cookie.match(/(?:^|; )theme=(light|dark)/)?.[1]; } catch (e) { }
        if (!theme) theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.classList.remove('light', 'dark');
      document.documentElement.classList.add(theme);
    })();
  </script>

  <link rel="stylesheet" href="/style-iframe.css?v=$COMMIT_HASH" />

  <style>
    input[type='file'] {
      width: 100%;
      font-family: inherit;
      font-size: inherit;
      color: var(--text-secondary);
    }

    .explorer-bar {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: 4px 20px 20px;
    }

    .input-group {
      display: grid;
      grid-template-columns: 90px minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
    }

    .input-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .input-group .button,
    .nav-controls .button {
      width: auto;
      padding: 8px 18px;
    }

    #filepath {
      width: 100%;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
    }

    .nav-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .path-display {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    #files_table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      overflow: hidden;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      box-shadow: var(--shadow);
    }

    #files_table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: transparent;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
    }

    #files_table td {
      padding: 10px 16px;
    }

    #files_table tr + tr td {
      border-top: 1px solid var(--border);
    }

    #files_table tr:hover td {
      background: var(--surface);
    }

    #files_table td a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
    }

    #files_table td.action-td {
      vertical-align: middle !important;
      padding: 4px 12px !important;
      white-space: nowrap;
      text-align: right;
    }

    .action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: auto;
      padding: 5px 12px;
      margin: 0 0 0 8px;
      font-size: 0.82rem;
      vertical-align: middle;
    }
  </style>

  <link href="/firework.css?v=$COMMIT_HASH" rel="stylesheet" />
  <script src="/firework.js?v=$COMMIT_HASH"></script>
  <script>
    // Sync theme to avoid cross-origin access (only for development)
    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'SYNC_THEME') {
        const isLight = event.data.theme === 'light';
        document.documentElement.classList.remove(isLight ? 'dark' : 'light');
        document.documentElement.classList.add(isLight ? 'light' : 'dark');
      }
    });
  </script>
</head>

<body>
  <div class="container">
    <div class="container-header">
      <div class="container-title">File Explorer</div>
      <div class="page-sub">Browse, upload and download files on the SD card.</div>
    </div>

    <div class="card" style="margin-bottom: var(--card-gap)">
      <div class="card-header"><span>Upload</span></div>
      <div class="explorer-bar">
        <div class="input-group">
          <label for="newfile">Source</label>
          <input id="newfile" type="file" onchange="setPath()" />
          <button id="upload" type="button" class="button btn-action" onclick="uploadFile()">Upload</button>
        </div>

        <div class="input-group">
          <label for="filepath">Destination</label>
          <input id="filepath" type="text" readonly placeholder="-" />
          <span></span>
        </div>

        <div class="nav-controls">
          <div class="path-display">
            <button class="button" id="dirup" type="button" onclick="dirup()" disabled>Directory up</button>
            <span id="currentpath"></span>
          </div>

          <button class="button" id="saveZipButton" type="button" title="Save all files in actual path as ZIP file">
            Save all files (ZIP)
          </button>
        </div>
      </div>
    </div>
    <div class="container-content">
      <!-- The the remaining part of body is injected by firmware (server_file.cpp) -->

      <script src="/sorttable.min.js?v=$COMMIT_HASH"></script>
      <script src="/fflate.min.js?v=$COMMIT_HASH"></script>
      <script src="/global.js?v=$COMMIT_HASH"></script>
      <script>
        // Sort by filename
        window.onload = function () {
          const nameHeader = document.querySelectorAll('#files_table th')[0];
          const typeHeader = document.querySelectorAll('#files_table th')[1];
          if (nameHeader) nameHeader.click();
          if (typeHeader) typeHeader.click();
        };

        // Zip all files listed in files_table
        document.getElementById('saveZipButton').addEventListener('click', async function () {
          const toastId = firework.launch('Saving all listed files. Please wait...', 'warning', 120000);
          const zipFiles = {};
          let skipped = 0;

          try {
            for (const link of document.querySelectorAll('#files_table tbody a')) {
              const url = link.getAttribute('href').split('?')[0];
              if (url.endsWith('/')) continue; // skip directories

              const filename = link.textContent;
              const res = await apiCall(url, { timeout: 60000 }, { parseType: 'blob' });
              if (!res.ok) {
                skipped++;
                console.error(`Failed to fetch ${filename}:`, res.error ?? res.status);
                continue;
              }
              zipFiles[filename] = new Uint8Array(await res.data.arrayBuffer());
            }

            if (Object.keys(zipFiles).length === 0) {
              firework.launch('No files to save in this folder', 'warning', 5000);
              return;
            }

            const zipData = fflate.zipSync(zipFiles, { level: 6 });

            const now = new Date();
            const p = (n) => String(n).padStart(2, '0');
            const timestamp = `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}_${p(now.getHours())}-${p(now.getMinutes())}-${p(now.getSeconds())}`;
            const filename = getPath().replace('/fileserver', '').replace(/^\/+|\/+$/g, '').replace(/\//g, '_') + '_' + timestamp + '.zip';

            downloadBlob(zipData, filename);
            firework.launch(`Archive saved: ${filename}`, 'success', 3000);
            if (skipped) firework.launch(`${skipped} file(s) could not be fetched and are missing in the archive`, 'warning', 10000);
          } catch (err) {
            console.error('Error creating ZIP:', err);
            firework.launch('Failed to create ZIP file', 'danger', 30000);
          } finally {
            firework.dismiss(toastId);
          }
        });

        function downloadBlob(data, filename) {
          const url = URL.createObjectURL(new Blob([data], { type: 'application/zip' }));
          const link = document.createElement('a');
          link.href = url;
          link.download = filename;

          document.body.appendChild(link);
          link.click();
          link.remove();

          setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function deleteEntry(name, url) {
          const isDir = url.includes('?task=deldir');
          const question = isDir
            ? `Are you sure you want to delete the folder '${name}' recursively?\n\nNote: This takes quite a while. Please be patient!`
            : `Are you sure you want to delete the file '${name}'?`;
          if (!confirm(question)) return;

          const loadingMsg = isDir ? "Deleting folder. Please wait..." : "Deleting file..."
          const res = await apiCallNotify('/delete' + url, { method: 'POST', timeout: isDir ? 120000 : 20000 },
            {
              action: 'Deletion',
              loadingMsg: loadingMsg
            });

          if (res.ok) {
            firework.sticky('Deletion completed', 'success', 2000);
            window.location.reload();
          }
        }

        function downloadEntry(name, url) {
          const link = document.createElement('a');
          link.href = getDomainname() + '/fileserver' + url;
          link.download = name;

          document.body.appendChild(link);
          link.click();
          link.remove();

          firework.launch(`File saved: ${name}`, 'success', 3000);
        }

        async function uploadFile() {
          const fileInput = document.getElementById('newfile');
          const uploadBtn = document.getElementById('upload');
          const filePath = document.getElementById('filepath').value;

          // Validation Logic
          const MAX_FILE_SIZE = 16000 * 1024;
          const MAX_FILE_SIZE_STR = '16MB';

          if (fileInput.files.length === 0) return firework.launch('No file selected', 'danger', 5000);
          if (!filePath) return firework.launch('File path on server is not set', 'danger', 5000);
          if (filePath.length > 100) return firework.launch('File name is too long: max. 100 characters', 'danger', 5000);
          if (filePath.includes(' ')) return firework.launch('File path on server cannot have spaces', 'danger', 5000);
          if (filePath.endsWith('/')) return firework.launch('File name not specified after path', 'danger', 5000);
          if (fileInput.files[0].size > MAX_FILE_SIZE) return firework.launch(`File size must be less than ${MAX_FILE_SIZE_STR}`, 'danger', 5000);

          fileInput.disabled = true;
          uploadBtn.disabled = true;

          const res = await apiCallNotify('/upload' + filePath + '?overwrite=true', { method: 'POST', body: fileInput.files[0], timeout: 60000 },
            {
              action: 'Uploading',
              loadingMsg: "Uploading file. Please wait..."
            });

          fileInput.disabled = false;
          uploadBtn.disabled = false;

          if (res.ok) {
            firework.sticky('Uploading completed', 'success', 2000);
            window.location.reload();
          }
        }

        function getPath() {
          return window.location.pathname.replace(/\/+$/, '') + '/';
        }

        function setPath() {
          document.getElementById('filepath').value =
            getPath().replace('/fileserver', '') + document.getElementById('newfile').files[0].name;
        }

        function dirup() {
          let url = window.location.href;

          // Remove any query or hash part first
          url = url.split('#')[0].split('?')[0];

          // Remove trailing slash if present
          if (url.endsWith('/')) {
            url = url.slice(0, -1);
          }

          // Remove the last path segment
          const lastSlashIndex = url.lastIndexOf('/');
          if (lastSlashIndex > -1) {
            const parentUrl = url.substring(0, lastSlashIndex + 1) + '?full=false';
            window.location.href = parentUrl;
          }
        }

        function checkAtRootLevel(res) {
          if (getPath() == '/fileserver/') {
            // Already at root level
            document.getElementById('dirup').disabled = true;
            return true;
          }

          document.getElementById('dirup').disabled = false;
          return false;
        }

        window.addEventListener('DOMContentLoaded', function () {
          checkAtRootLevel();
          document.getElementById('currentpath').innerHTML =
            'Path: <b>' + getPath().replace('/fileserver', '') + '</b>';
          document.cookie = 'page=' + getPath() + '?full=false;path=/;SameSite=Lax';
        });

        window.addEventListener('DOMContentLoaded', () => {
          window.parent.postMessage({ type: 'iframe-ready' }, '*');
        });
      </script>

      <!-- The the remaining part of body is injected by firmware (server_file.cpp) -->
