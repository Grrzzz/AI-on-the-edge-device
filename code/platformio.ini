; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
src_dir = main
default_envs = esp32cam


; #############################################################################
; Global Definitions
; Used for all environments
; #############################################################################
[env]
platform = platformio/espressif32 @ 7.1.3
framework = espidf
build_flags =
    -Wno-sign-compare
    -Wno-missing-field-initializers
    -fno-exceptions
    ;-D ENV_DISABLE_MQTT         ; Software module: Uncomment to disable
    ;-D DISABLE_POST_BUILD_TASKS ; Disable post build tasks (WebUI related tasks, etc.)
extra_scripts =
    pre:scripts/patch_espidf_objpath.py ; Ensure proper paths for managed components (Fix issue with tflite component and platformio > v7.x)
    post:scripts/show_memory_usage.py ; Show memory usage overview
    post:scripts/post_build_tasks.py ; Building WebUI (tooltips, hashes, API docs, zip)
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder


; #############################################################################
; Board
; ESP32CAM
; #############################################################################
[env:esp32cam]
board = esp32cam
board_build.partitions = partitions_4MB_legacy.csv
build_flags =
    ${env.build_flags}
    -D BOARD_AITHINKER_ESP32CAM ; Define board type (see 'include/defines.h')
